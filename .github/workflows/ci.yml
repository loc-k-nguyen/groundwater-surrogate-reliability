name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9.25"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-analysis-lock.txt
      - name: Verify repository and manifest
        run: |
          python scripts/verify_repository.py
          python scripts/make_manifest.py --check
      - name: Run CPU regression tests and source checks
        run: |
          python scripts/run_tests.py --suite fast --report ../fast_cpu.json
          python scripts/run_tests.py --suite full --report ../full_cpu.json
          python scripts/synthetic_demo.py --output ../synthetic_fixture.json
          python scripts/evaluate_four_family_quality_v5.py --check-sources
          python scripts/run_orientation_fixed_inference.py --check-sources
      - name: Reproduce corrected scalar figures and supplement
        run: |
          python scripts/build_v5_analysis.py --output-dir ../reproduced_v5
          python scripts/verify_repository.py --reproduced-dir ../reproduced_v5
          python scripts/build_selection_supplement.py --output ../selection_crc_baselines.json
          python scripts/verify_repository.py --supplement ../selection_crc_baselines.json
          python scripts/build_physical_diagnostics_v6.py --output-dir ../physical_v6
          python scripts/verify_repository.py --physical-dir ../physical_v6
