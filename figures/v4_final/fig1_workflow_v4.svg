   <g id="text_1">
    <text style="font: 700 8.2px 'DejaVu Sans'; text-anchor: start" x="9.12384" y="17.065279" transform="rotate(-0 9.12384 17.065279)">1  Prediction and simulator reference</text>
   </g>
   <g id="text_2">
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(21.736777 42.56428)">Conductivity</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(34.669714 52.681095)">field K</text>
   </g>
   <g id="text_3">
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(163.264751 42.56428)">Trained K-only</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(172.319985 52.681095)">surrogate</text>
   </g>
   <g id="text_4">
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(325.962489 42.56428)">Predicted concentration</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(320.771505 52.681095)">Model-specific uncertainty</text>
   </g>
   <g id="text_5">
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(28.272433 96.99628)">Transport</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(31.162933 107.113095)">controls</text>
   </g>
   <g id="text_6">
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(158.568329 96.99628)">MODFLOW-2005</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(162.606829 107.113095)">+ MT3D-USGS</text>
   </g>
   <g id="text_7">
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(325.421161 96.99628)">Simulator concentration</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(333.430255 107.113095)">(reference for audit)</text>
   </g>
   <g id="text_8">
    <text style="font: 8px 'DejaVu Sans'; text-anchor: middle" x="99.44064" y="74.28672" transform="rotate(-0 99.44064 74.28672)">K</text>
   </g>
   <g id="text_9">
    <text style="font: 700 8.2px 'DejaVu Sans'; text-anchor: start" x="9.12384" y="137.437759" transform="rotate(-0 9.12384 137.437759)">2  Complementary diagnostics</text>
   </g>
   <g id="text_10">
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(40.692572 156.855452)">A  Input screening</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(77.9904 166.972266)"/>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(37.488166 177.08908)">Input summaries vs</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(41.960369 187.205895)">training envelope</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(77.9904 197.322709)"/>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(31.818634 207.439523)">Low-support reference</text>
   </g>
   <g id="text_11">
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(184.439933 156.855452)">B  Uncertainty ranking</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(230.625792 166.972266)"/>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(179.471886 177.08908)">Full field: prediction-time</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(173.403245 187.205895)">Oracle plume: retrospective</text>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(230.625792 197.322709)"/>
    <text style="font: 8.2px 'DejaVu Sans'" transform="translate(188.644354 207.439523)">Validate per monitor</text>
   </g>
   <g id="text_12">
    <text style="font: 7.9px 'DejaVu Sans'" transform="translate(334.973866 157.697989)">C  Conformal calibration</text>
    <text style="font: 7.9px 'DejaVu Sans'" transform="translate(382.8096 167.444676)"/>
    <text style="font: 7.9px 'DejaVu Sans'" transform="translate(320.923592 177.191363)">Residuals + calibration support</text>
    <text style="font: 7.9px 'DejaVu Sans'" transform="translate(326.73935 186.93805)">Coverage and interval width</text>
    <text style="font: 7.9px 'DejaVu Sans'" transform="translate(382.8096 196.684736)"/>
    <text style="font: 7.9px 'DejaVu Sans'" transform="translate(329.145764 206.431423)">State region and score unit</text>
   </g>
   <g id="text_13">
    <text style="font: 700 8.2px 'DejaVu Sans'; text-anchor: start" x="9.12384" y="232.304959" transform="rotate(-0 9.12384 232.304959)">3  Controlled comparisons and dependence checks</text>
   </g>
   <g id="text_14">
    <text style="font: 8px 'DejaVu Sans'" transform="translate(34.96983 253.870238)">Same spatial pattern; changed variance</text>
    <text style="font: 8px 'DejaVu Sans'" transform="translate(44.65358 263.7403)">Input-visible amplitude comparison</text>
    <text style="font: 8px 'DejaVu Sans'" transform="translate(46.99108 273.610363)">Shared geological draw identifiers</text>
   </g>
   <g id="text_15">
    <text style="font: 8px 'DejaVu Sans'" transform="translate(273.460795 253.870238)">Same K; changed transport controls</text>
    <text style="font: 8px 'DejaVu Sans'" transform="translate(278.002045 263.7403)">Prediction-only scores unchanged</text>
    <text style="font: 8px 'DejaVu Sans'" transform="translate(294.168295 273.610363)">Oracle region can change</text>
   </g>
   <g id="text_16">
    <text style="font: 8.2px 'DejaVu Sans'; text-anchor: middle" x="230.4" y="296.36928" transform="rotate(-0 230.4 296.36928)">Check training twins and held-out draw identifiers.</text>
   </g>
   <g id="text_17">
    <text style="font: 700 8px 'DejaVu Sans'; text-anchor: middle" x="230.4" y="309.43296" transform="rotate(-0 230.4 309.43296)">Finite-design evidence; no general detection or deployment guarantee.</text>
